[workspace]
resolver = "3"
members = [
    "crates/puv",
    "crates/puv-core",
    "crates/puv-semver",
    "crates/puv-registry",
    "crates/puv-runtime",
    "crates/puv-resolver",
    "crates/puv-cache",
    "crates/puv-env",
    "crates/puv-tool",
    "crates/puv-contain",
    "crates/puv-check",
    "crates/puv-build",
    "crates/puv-package",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.92"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
directories = "6.0"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli"] }
pubgrub = "0.4"
flate2 = "1.1"
tar = "0.4"
zip = "2.2"
regex = "1.11"
rayon = "1.10"
tree-sitter = "0.25"
tree-sitter-php = "0.24"
tempfile = "3.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
puv-core = { path = "crates/puv-core" }
puv-semver = { path = "crates/puv-semver" }
puv-registry = { path = "crates/puv-registry" }
puv-runtime = { path = "crates/puv-runtime" }
puv-resolver = { path = "crates/puv-resolver" }
puv-cache = { path = "crates/puv-cache" }
puv-env = { path = "crates/puv-env" }
puv-tool = { path = "crates/puv-tool" }
puv-contain = { path = "crates/puv-contain" }
puv-check = { path = "crates/puv-check" }
puv-build = { path = "crates/puv-build" }
puv-package = { path = "crates/puv-package" }
